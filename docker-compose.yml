services:
  hugo:
    image: ghcr.io/gohugoio/hugo:v0.169.0@sha256:a146e0639230bbc73358e6563240f0a6103466f0390b80a457c775068ec802a9
    environment:
      HUGO_ENABLEGITINFO: "false"
    ports:
      - "127.0.0.1:1313:1313"
    volumes:
      - ./assets:/project/assets:ro
      - ./config:/project/config:ro
      - ./content:/project/content:ro
      - ./layouts:/project/layouts:ro
      - ./static:/project/static:ro
    command: server --bind 0.0.0.0 --baseURL http://127.0.0.1:1313/ --disableFastRender --noHTTPCache
