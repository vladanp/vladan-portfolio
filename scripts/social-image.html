<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vladan Petrović | Social image</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #8e3f2d;
        --background: #f5f1e8;
        --muted: #5d5a55;
        --rule: #aaa398;
        --text: #17181a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        padding: 58px 64px;
        color: var(--text);
        background: var(--background);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        width: 100%;
        height: 100%;
        border: 2px solid var(--rule);
        padding: 34px 40px;
      }

      header,
      footer {
        display: flex;
        justify-content: space-between;
        gap: 32px;
        align-items: center;
      }

      header {
        border-bottom: 2px solid var(--rule);
        padding-bottom: 26px;
      }

      .context,
      .section {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .section {
        color: var(--accent);
      }

      .identity {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h1 {
        max-width: 920px;
        margin: 0 0 24px;
        font-size: 88px;
        letter-spacing: -0.058em;
        line-height: 0.94;
      }

      .role {
        margin: 0 0 14px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .scope {
        margin: 0;
        color: var(--muted);
        font-size: 26px;
        font-weight: 600;
      }

      footer {
        border-top: 2px solid var(--rule);
        padding-top: 26px;
      }

      .current {
        display: flex;
        gap: 16px;
        align-items: center;
        color: var(--muted);
        font-size: 18px;
        font-weight: 700;
      }

      .current img {
        width: 132px;
        height: auto;
      }

      .url {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="context">Belgrade, Serbia</p>
        <p class="section">Portfolio</p>
      </header>
      <div class="identity">
        <h1>Vladan Petrović</h1>
        <p class="role">Senior Software Engineer</p>
        <p class="scope">Product engineering · Architecture · Developer experience</p>
      </div>
      <footer>
        <div class="current">
          <span>Currently at</span>
          <img src="../assets/images/rivian-wordmark.svg" alt="Rivian" />
        </div>
        <p class="url">vladan.dev</p>
      </footer>
    </main>
  </body>
</html>
