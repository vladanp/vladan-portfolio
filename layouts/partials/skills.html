<section class="skills" aria-labelledby="skills-heading">
  <h2 id="skills-heading" class="skills__heading">
    {{ .Site.Params.skillsTitle }}
  </h2>
  <ul class="skills-container">
    {{ range .Site.Params.skills }}
      <li class="skills-container__skill">
        <a
          href="{{ .url }}"
          target="_blank"
          rel="noopener noreferrer"
          class="skills-container__link"
          aria-label="Learn more about {{ .name }} (opens in a new tab)"
        >
          {{ $skillImage200 := resources.Get .image200 | fingerprint }}
          {{ $skillImage400 := resources.Get .image400 | fingerprint }}
          <img
            src="{{ $skillImage200.RelPermalink }}"
            srcset="
              {{ $skillImage200.RelPermalink }} 200w,
              {{ $skillImage400.RelPermalink }} 400w
            "
            sizes="80px"
            alt=""
            width="80"
            height="80"
            decoding="async"
          />
          <span class="skills-container__name">{{ .name }}</span>
        </a>
      </li>
    {{ end }}
  </ul>
</section>
