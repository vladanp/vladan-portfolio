<section id="work" class="indexed-section" aria-labelledby="work-heading">
  <div class="site-shell indexed-section__grid">
    {{ partial "section-heading.html" (dict "id" "work" "title" .Params.work_section_title) }}
    <div class="systems-list">
      {{ range .Params.systems }}
        <article class="system-entry">
          <header class="system-entry__header">
            <p class="eyebrow">{{ .company }}</p>
            <h3 class="system-entry__title">{{ .title }}</h3>
          </header>
          <p class="system-entry__summary">{{ .summary }}</p>
        </article>
      {{ end }}
    </div>
  </div>
</section>
