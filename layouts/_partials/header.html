{{- $sectionPrefix := cond .IsHome "" .Site.Home.RelPermalink -}}
<header class="site-header">
  <div class="site-shell site-header__inner">
    <a
      class="site-header__identity"
      href="{{ .Site.Home.RelPermalink }}"
      {{ if .IsHome }}aria-current="page"{{ end }}
    >
      <span class="site-header__name">{{ .Site.Params.name }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <ul class="site-nav__list">
        <li><a href="{{ $sectionPrefix }}#work">Work</a></li>
        <li><a href="{{ $sectionPrefix }}#approach">Approach</a></li>
        <li>
          <a
            href="{{ .Site.Params.cvPath | relURL }}"
            type="application/pdf"
            target="_blank"
            rel="noopener"
            aria-label="CV, PDF, opens in a new tab"
          >CV</a>
        </li>
        <li><a href="{{ $sectionPrefix }}#contact">Contact</a></li>
        {{- with index (where .Site.Params.socialLinks "name" "LinkedIn") 0 }}
          <li>
            <a
              href="{{ .url }}"
              target="_blank"
              rel="me noopener"
              aria-label="LinkedIn profile, opens in a new tab"
            >LinkedIn</a>
          </li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
