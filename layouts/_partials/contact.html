<section id="contact" class="indexed-section" aria-labelledby="contact-heading">
  <div class="site-shell indexed-section__grid">
    {{ partial "section-heading.html" (dict "id" "contact" "title" .Params.contact_section_title) }}
    <div class="contact__content">
      <h3>{{ .Params.about_title }}</h3>
      <p class="contact__about">{{ .Params.about_summary }}</p>
      <ul class="contact-links" aria-label="Contact and professional profiles">
        <li>
          <a
            href="{{ .Site.Params.cvPath | relURL }}"
            type="application/pdf"
            target="_blank"
            rel="noopener"
            aria-label="CV, PDF, opens in a new tab"
          >
            <span>CV, PDF</span>
            <span aria-hidden="true">↓</span>
          </a>
        </li>
        <li>
          <a
            href="mailto:{{ .Site.Params.email }}"
            target="_blank"
            rel="noopener"
            aria-label="Email {{ .Site.Params.name }}, opens an email composer"
          >
            <span>Email</span>
            <span aria-hidden="true">↗</span>
          </a>
        </li>
        {{ range .Site.Params.socialLinks }}
          <li>
            <a
              href="{{ .url }}"
              target="_blank"
              rel="me noopener"
              aria-label="{{ .name }} profile, opens in a new tab"
            >
              <span>{{ .name }}</span>
              <span aria-hidden="true">↗</span>
            </a>
          </li>
        {{ end }}
      </ul>
    </div>
  </div>
</section>
