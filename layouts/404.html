{{ define "main" }}
  <main id="main-content" class="error-page" tabindex="-1">
    <div class="error-page__content">
      <p class="error-page__code" aria-hidden="true">404</p>
      <h1 class="error-page__title">Page Not Found</h1>
      <p class="error-page__message">
        The page you requested could not be found. It may have moved, or the URL
        may be incorrect.
      </p>
      <a href="{{ .Site.Home.RelPermalink }}" class="error-page__home-link">
        Go to Homepage
      </a>
    </div>
  </main>
{{ end }}
