name: Production Audit

# workflow_run jobs run with this repository's token, so they only act on
# successful pushes to main from this repository, never on pull requests.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI and Deployment]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Verify deployed revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for GitHub Pages to publish this revision
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --max-time 10 \
              --header 'Cache-Control: no-cache' \
              "https://vladan.dev/?revision=${EXPECTED_REVISION}-${attempt}" \
              | grep --fixed-strings "$EXPECTED_REVISION" > /dev/null; then
              echo "GitHub Pages is serving revision $EXPECTED_REVISION"
              exit 0
            fi
            sleep 5
          done

          echo "GitHub Pages did not publish revision $EXPECTED_REVISION in time" >&2
          exit 1

      - name: Audit the deployed site
        run: pnpm lighthouse:production
        env:
          LIGHTHOUSE_RUNS: 3

      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-production-${{ github.event.workflow_run.id }}
          path: .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  release:
    name: Publish versioned GitHub release
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Push the version tag and create the GitHub Release.

    steps:
      - name: Checkout audited revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Semantic Release builds its own authenticated URL from
          # GITHUB_TOKEN, so the token stays out of .git/config.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .mise.toml
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish semantic release
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
