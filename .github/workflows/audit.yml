name: SEO Audit

on:
  workflow_run:
    workflows: ["Deploy Hugo Site and Create Release"]
    types:
      - completed

jobs:
  seo_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit using Lighthouse
        uses: googlechrome/lighthouse-ci@v0.14.0
        with:
          urls: "https://vladan.dev"
          configPath: "./lighthouserc.json"
