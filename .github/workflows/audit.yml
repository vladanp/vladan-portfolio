name: Production Audit

on:
  workflow_run:
    workflows: ["Deploy Hugo Site and Create Release"]
    types:
      - completed

jobs:
  audit:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lighthouse against production
        run: pnpm exec lhci autorun --config=./lighthouserc.prod.json

      - name: Upload Lighthouse report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-prod-report
          path: .lighthouseci/
          retention-days: 7
