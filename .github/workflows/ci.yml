name: CI and Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production site
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | pnpm commitlint
          pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 0.165.0

      - name: Check formatting
        run: pnpm format:check

      - name: Lint JavaScript and TypeScript
        run: pnpm lint

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Validate Hugo configuration
        run: hugo config --environment production > /dev/null

      - name: Build production site
        run: pnpm build
        env:
          HUGO_PARAMS_BUILDREVISION: ${{ github.sha }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser, integrity, and accessibility tests
        run: pnpm test

      - name: Run local Lighthouse audit
        run: pnpm lighthouse

      - name: Upload validated production site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-site-${{ github.sha }}
          path: public/
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports-${{ github.run_id }}
          path: |
            .lighthouseci/
            e2e-results/
            playwright-report/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy validated site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: https://vladan.dev/
    permissions:
      contents: write

    steps:
      - name: Download validated production site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-site-${{ github.sha }}
          path: site

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
